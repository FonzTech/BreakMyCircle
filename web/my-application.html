<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Break My Circle</title>
  <link rel="stylesheet" href="WebApplication.css" />
  <link rel="stylesheet" href="my-application.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <div id="container" class="mn-container fullsize">
    <div id="sizer" class="mn-sizer"><div id="expander" class="mn-expander"><div id="listener" class="mn-listener">
      <canvas class="mn-canvas" id="canvas"></canvas>
      <div class="mn-status" id="status">Initialization...</div>
      <div class="mn-status-description" id="status-description"></div>
      <script>
        (() => {
          const canvas = document.getElementById("canvas");
          let activeTouchId = null;

          const resizeCanvas = () => {
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
          };

          const dispatchMouseEvent = (type, touch, buttons) => {
            canvas.dispatchEvent(new MouseEvent(type, {
              bubbles: true,
              cancelable: true,
              view: window,
              clientX: touch.clientX,
              clientY: touch.clientY,
              button: 0,
              buttons,
            }));
          };

          const activeTouch = (touches) =>
            Array.from(touches).find((touch) => touch.identifier === activeTouchId);

          canvas.addEventListener("touchstart", (event) => {
            if (activeTouchId !== null || event.touches.length !== 1) {
              event.preventDefault();
              return;
            }

            const touch = event.changedTouches[0];
            activeTouchId = touch.identifier;
            event.preventDefault();
            dispatchMouseEvent("mousedown", touch, 1);
          }, { passive: false });

          window.addEventListener("touchmove", (event) => {
            if (activeTouchId === null) return;
            event.preventDefault();

            const touch = activeTouch(event.changedTouches);
            if (touch) dispatchMouseEvent("mousemove", touch, 1);
          }, { passive: false });

          const endTouch = (event) => {
            if (activeTouchId === null) return;
            event.preventDefault();

            const touch = activeTouch(event.changedTouches);
            if (!touch) return;

            dispatchMouseEvent("mouseup", touch, 0);
            activeTouchId = null;
          };

          window.addEventListener("touchend", endTouch, { passive: false });
          window.addEventListener("touchcancel", endTouch, { passive: false });
          window.addEventListener("resize", resizeCanvas);
          resizeCanvas();
        })();
      </script>
      <script src="EmscriptenApplication.js"></script>
      <script async="async" src="my-application.js"></script>
    </div></div></div>
  </div>
</body>
</html>
