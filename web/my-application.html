<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Break My Circle</title>
  <link rel="stylesheet" href="WebApplication.css" />
  <link rel="stylesheet" href="my-application.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <div id="container" class="mn-container fullsize">
    <div id="sizer" class="mn-sizer"><div id="expander" class="mn-expander"><div id="listener" class="mn-listener">
      <canvas class="mn-canvas" id="canvas"></canvas>
      <div class="mn-status" id="status">Initialization...</div>
      <div class="mn-status-description" id="status-description"></div>
      <script>
        (() => {
          const canvas = document.getElementById("canvas");
          const resizeCanvas = () => {
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
          };

          window.addEventListener("resize", resizeCanvas);
          resizeCanvas();
        })();
      </script>
      <script src="EmscriptenApplication.js"></script>
      <script async="async" src="my-application.js"></script>
    </div></div></div>
  </div>
</body>
</html>
